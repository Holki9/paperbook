<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PaperBook</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      --bg-desk: #18181b;
      --hud-bg: rgba(24, 24, 27, 0.88);
      --hud-border: rgba(255, 255, 255, 0.12);
      --hud-text: #f4f4f5;
      --hud-accent: #e4e4e7;
      --hud-accent-bg: rgba(255, 255, 255, 0.16);
    }

    body[data-theme="paper"] {
      --bg-desk: #1c1917;
      --hud-bg: rgba(28, 25, 23, 0.90);
      --hud-border: rgba(245, 245, 244, 0.15);
      --hud-text: #f5f5f4;
      --hud-accent: #d6d3d1;
      --hud-accent-bg: rgba(255, 255, 255, 0.14);
    }

    body[data-theme="amoled"] {
      --bg-desk: #000000;
      --hud-bg: rgba(10, 10, 10, 0.92);
      --hud-border: rgba(255, 255, 255, 0.15);
      --hud-text: #ffffff;
      --hud-accent: #38bdf8;
      --hud-accent-bg: rgba(56, 189, 248, 0.2);
    }

    body[data-theme="eink"] {
      --bg-desk: #ffffff;
      --hud-bg: #ffffff;
      --hud-border: #000000;
      --hud-text: #000000;
      --hud-accent: #000000;
      --hud-accent-bg: #e5e5e5;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-desk);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: background-color 0.3s ease;
    }

    #app-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #book-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #flipbook {
      display: block;
      margin: auto;
    }

    .page {
      background-color: #ffffff;
      overflow: hidden;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.35);
    }

    /* Filters for night/amoled reading */
    body[data-theme="amoled"] .stf__parent canvas {
      filter: invert(0.92) hue-rotate(180deg) brightness(0.95) contrast(1.1);
    }

    body[data-theme="eink"] .stf__parent canvas {
      filter: grayscale(1) contrast(1.4);
    }

    /* Tap zone in middle of screen to toggle HUD */
    #touch-hud-trigger {
      position: absolute;
      top: 25%;
      left: 25%;
      width: 50%;
      height: 50%;
      z-index: 50;
      cursor: pointer;
    }

    /* Minimalist Floating HUD */
    .hud-panel {
      position: absolute;
      z-index: 100;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: var(--hud-bg);
      border: 1px solid var(--hud-border);
      color: var(--hud-text);
      transition: opacity 0.25s ease, transform 0.25s ease;
      opacity: 0;
      pointer-events: none;
    }

    .hud-panel.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* Top HUD Bar */
    #hud-top {
      top: 0;
      left: 0;
      right: 0;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 0 0 20px 20px;
      transform: translateY(-20px);
    }

    #hud-top.visible {
      transform: translateY(0);
    }

    .book-title-tag {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 60vw;
    }

    .hud-btn {
      background: var(--hud-accent-bg);
      border: 1px solid var(--hud-border);
      color: var(--hud-text);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .hud-btn:active {
      transform: scale(0.96);
      opacity: 0.8;
    }

    /* Bottom HUD Bar */
    #hud-bottom {
      bottom: 0;
      left: 0;
      right: 0;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border-radius: 24px 24px 0 0;
      transform: translateY(20px);
    }

    #hud-bottom.visible {
      transform: translateY(0);
    }

    .hud-controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
    }

    .theme-selector {
      display: flex;
      gap: 6px;
      background: rgba(0, 0, 0, 0.2);
      padding: 4px;
      border-radius: 14px;
      border: 1px solid var(--hud-border);
    }

    .theme-btn {
      background: transparent;
      border: none;
      color: var(--hud-text);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .theme-btn.active {
      background: var(--hud-accent-bg);
      color: var(--hud-accent);
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }

    .page-slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .page-counter {
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      min-width: 65px;
      text-align: center;
    }

    .slider {
      flex: 1;
      -webkit-appearance: none;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
    }

    body[data-theme="eink"] .slider {
      background: #ccc;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--hud-text);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    /* Loading Overlay */
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg-desk);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 200;
      color: var(--hud-text);
      transition: opacity 0.3s ease;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: var(--hud-text);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loading-text {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    /* Page styling for demo book */
    .demo-page {
      background-color: #FDFBF7;
      color: #27272a;
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      font-family: "Georgia", "Times New Roman", serif;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.05);
    }

    .demo-header {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #71717a;
      text-align: center;
      border-bottom: 1px solid #e4e4e7;
      padding-bottom: 12px;
    }

    .demo-title {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.3;
      margin: 20px 0 14px 0;
      text-align: center;
      color: #18181b;
    }

    .demo-body {
      font-size: 15px;
      line-height: 1.75;
      text-align: justify;
      color: #3f3f46;
      flex: 1;
    }

    .demo-body p {
      margin-bottom: 14px;
      text-indent: 1.5em;
    }

    .demo-footer {
      font-size: 12px;
      text-align: center;
      color: #a1a1aa;
      border-top: 1px solid #f4f4f5;
      padding-top: 10px;
    }

    .cta-card {
      background: #f4f4f5;
      border: 1px dashed #d4d4d8;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-top: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .cta-btn {
      background: #18181b;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 12px;
      cursor: pointer;
      display: inline-block;
    }

    /* Fallback file input */
    #hidden-file-input {
      display: none;
    }

    /* Bookshelf Screen */
    #bookshelf-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-desk);
      z-index: 150;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      color: var(--hud-text);
      transition: opacity 0.25s ease;
    }

    #bookshelf-view.hidden {
      display: none;
      opacity: 0;
      pointer-events: none;
    }

    #bookshelf-header {
      padding: calc(env(safe-area-inset-top, 16px) + 16px) 20px 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--hud-border);
      position: sticky;
      top: 0;
      background: var(--hud-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 10;
    }

    .shelf-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .shelf-brand-icon {
      font-size: 24px;
    }

    .shelf-brand-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    .shelf-add-btn {
      background: var(--hud-accent-bg);
      border: 1px solid var(--hud-border);
      color: var(--hud-text);
      padding: 10px 16px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .shelf-add-btn:active {
      transform: scale(0.96);
    }

    #bookshelf-content {
      padding: 20px;
      flex: 1;
      padding-bottom: 60px;
    }

    #bookshelf-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    @media (min-width: 600px) {
      #bookshelf-grid {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 20px;
      }
    }

    .book-card {
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--hud-border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
    }

    .book-card:active {
      transform: scale(0.97);
    }

    .book-cover-container {
      width: 100%;
      aspect-ratio: 0.68;
      background: #111113;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .book-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .book-card-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .book-card-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--hud-text);
    }

    .book-card-meta {
      font-size: 11px;
      color: #a1a1aa;
    }

    .book-card-progress {
      height: 4px;
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 4px;
    }

    .book-card-progress-bar {
      height: 100%;
      background: #38bdf8;
      border-radius: 2px;
    }

    .book-delete-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f87171;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
      z-index: 5;
    }

    #zoom-reset-btn {
      position: absolute;
      bottom: 24px;
      right: 24px;
      z-index: 60;
      background: var(--hud-bg);
      border: 1px solid var(--hud-border);
      color: var(--hud-text);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body data-theme="paper">

  <div id="app-container">
    <div id="book-viewport">
      <div id="flipbook"></div>
      <!-- Center tap area to toggle HUD -->
      <div id="touch-hud-trigger" onclick="toggleHud()"></div>
    </div>
    <button id="zoom-reset-btn" onclick="resetZoom()">🔍 1.0x (Сброс)</button>
  </div>

  <!-- Bookshelf Screen -->
  <div id="bookshelf-view">
    <div id="bookshelf-header">
      <div class="shelf-brand">
        <span class="shelf-brand-icon">📚</span>
        <span class="shelf-brand-title">Моя библиотека</span>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="shelf-add-btn" onclick="triggerPickPdf()">
          <span>➕</span> Добавить PDF
        </button>
        <button class="shelf-add-btn" id="shelf-close-btn" style="display: none;" onclick="closeBookshelf()">
          <span>✕</span> К чтению
        </button>
      </div>
    </div>
    <div id="bookshelf-content">
      <div id="bookshelf-grid"></div>
      <div id="bookshelf-empty" style="text-align: center; margin-top: 80px; color: #a1a1aa; display: none;">
        <div style="font-size: 54px; margin-bottom: 12px;">📖</div>
        <div style="font-size: 18px; font-weight: 600; color: var(--hud-text);">Библиотека пуста</div>
        <div style="font-size: 13px; margin-top: 8px; line-height: 1.5;">Нажмите «Добавить PDF» выше,<br>чтобы открыть любимые книги и комиксы.</div>
      </div>
    </div>
  </div>

  <!-- Top Floating HUD -->
  <div id="hud-top" class="hud-panel">
    <button class="hud-btn" onclick="openBookshelf()" style="font-weight: 600;">
      <span>📚</span> Полка
    </button>
    <div class="book-title-tag" id="hud-book-title" style="flex: 1; text-align: center; margin: 0 8px;">PaperBook • Демо</div>
    <div style="display: flex; gap: 8px;">
      <button class="hud-btn" onclick="triggerPickPdf()">
        <span>➕</span> Добавить
      </button>
    </div>
  </div>

  <!-- Bottom Floating HUD -->
  <div id="hud-bottom" class="hud-panel">
    <div class="page-slider-container">
      <span class="page-counter" id="page-counter">1 / 1</span>
      <input type="range" class="slider" id="page-slider" min="0" max="0" value="0" oninput="onSliderChange(this.value)">
    </div>

    <div class="hud-controls-row">
      <!-- Theme Selection -->
      <div class="theme-selector">
        <button class="theme-btn active" id="btn-theme-paper" onclick="setTheme('paper')">Бумага</button>
        <button class="theme-btn" id="btn-theme-amoled" onclick="setTheme('amoled')">AMOLED</button>
        <button class="theme-btn" id="btn-theme-eink" onclick="setTheme('eink')">E-Ink</button>
      </div>

      <!-- Quick Toggles -->
      <div style="display: flex; gap: 8px;">
        <button class="hud-btn" id="sound-btn" onclick="toggleSound()">
          <span id="sound-icon">🔊</span> Звук
        </button>
        <button class="hud-btn" id="spread-btn" onclick="toggleSpread()">
          <span id="spread-icon">📖</span> <span id="spread-text">Авто</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Loading Indicator -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">Загрузка книги...</div>
  </div>

  <!-- Hidden Audio and File Input -->
  <audio id="page-flip-sound" src="audio/page-flip.mp3" preload="auto"></audio>
  <input type="file" id="hidden-file-input" accept="application/pdf" onchange="onLocalFilePicked(event)">

  <!-- External Libraries -->
  <script src="js/page-flip.browser.js"></script>
  <script src="js/pdf.min.js"></script>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'js/pdf.worker.min.js';

    let pageFlip = null;
    let currentTheme = 'paper';
    let soundEnabled = true;
    let forceSinglePage = false;
    let totalPages = 0;
    let currentPageIndex = 0;
    let hudVisible = false;
    let pdfDoc = null;
    let flipAudio = document.getElementById('page-flip-sound');

    // Low-latency Web Audio Context for crisp flip sound
    let audioCtx = null;
    let audioBuffer = null;

    function initWebAudio() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          audioCtx = new AudioContext();
          fetch('audio/page-flip.mp3')
            .then(res => res.arrayBuffer())
            .then(buf => audioCtx.decodeAudioData(buf))
            .then(decoded => {
              audioBuffer = decoded;
            })
            .catch(() => {});
        }
      } catch (e) {}
    }

    function playFlipSound() {
      if (!soundEnabled) return;
      if (audioCtx && audioBuffer) {
        try {
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
          const source = audioCtx.createBufferSource();
          source.buffer = audioBuffer;
          // Randomize subtle playback rate for organic sound variation
          source.playbackRate.value = 0.95 + Math.random() * 0.1;
          source.connect(audioCtx.destination);
          source.start(0);
          return;
        } catch (e) {}
      }
      // Fallback HTML5 Audio
      if (flipAudio) {
        flipAudio.currentTime = 0;
        flipAudio.play().catch(() => {});
      }
    }

    // Toggle HUD
    function toggleHud() {
      if (currentScale > 1.05) return;
      hudVisible = !hudVisible;
      document.getElementById('hud-top').classList.toggle('visible', hudVisible);
      document.getElementById('hud-bottom').classList.toggle('visible', hudVisible);
    }

    function hideHud() {
      if (hudVisible) {
        hudVisible = false;
        document.getElementById('hud-top').classList.remove('visible');
        document.getElementById('hud-bottom').classList.remove('visible');
      }
    }

    // Themes
    function setTheme(theme) {
      currentTheme = theme;
      document.body.setAttribute('data-theme', theme);
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-theme-' + theme).classList.add('active');

      if (theme === 'eink') {
        // E-Ink optimization: disable sound, instant snap
        if (pageFlip) {
          pageFlip.getSettings().flippingTime = 120;
          pageFlip.getSettings().drawShadow = false;
        }
      } else {
        if (pageFlip) {
          pageFlip.getSettings().flippingTime = 600;
          pageFlip.getSettings().drawShadow = true;
        }
      }
    }

    // Sound toggle
    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-icon').innerText = soundEnabled ? '🔊' : '🔇';
    }

    // Single / Double page toggle
    function toggleSpread() {
      forceSinglePage = !forceSinglePage;
      document.getElementById('spread-text').innerText = forceSinglePage ? '1 стр.' : 'Авто';
      recalculateAndRebuild();
    }

    // Slider
    function onSliderChange(val) {
      val = parseInt(val, 10);
      if (pageFlip && val !== currentPageIndex) {
        pageFlip.flip(val);
      }
    }

    function updatePageIndicator(pageIdx) {
      currentPageIndex = pageIdx;
      document.getElementById('page-slider').value = pageIdx;
      document.getElementById('page-counter').innerText = (pageIdx + 1) + ' / ' + totalPages;
    }

    let currentPdfRatio = 0.68;

    // Calculate dimensions matching device screen aspect ratio
    function getBookDimensions() {
      let w = window.innerWidth || document.documentElement.clientWidth || screen.width || 412;
      let h = window.innerHeight || document.documentElement.clientHeight || screen.height || 915;
      if (w <= 0) w = 412;
      if (h <= 0) h = 915;
      const isLandscape = w > h;
      const ratio = currentPdfRatio || 0.68;

      if (isLandscape && !forceSinglePage) {
        // Two page spread in landscape
        const maxBookW = w * 0.98;
        const maxBookH = h * 0.96;
        let spreadW, spreadH;
        if (maxBookW / maxBookH < ratio * 2) {
          spreadW = maxBookW;
          spreadH = spreadW / (ratio * 2);
        } else {
          spreadH = maxBookH;
          spreadW = spreadH * (ratio * 2);
        }
        const singleW = Math.max(Math.floor(spreadW / 2), 200);
        const finalH = Math.max(Math.floor(spreadH), 300);
        return {
          width: singleW,
          height: finalH,
          usePortrait: false
        };
      } else {
        // Single page portrait
        const maxW = w * 0.98;
        const maxH = h * 0.96;
        let pageW, pageH;
        if (maxW / maxH < ratio) {
          pageW = maxW;
          pageH = pageW / ratio;
        } else {
          pageH = maxH;
          pageW = pageH * ratio;
        }
        return {
          width: Math.max(Math.floor(pageW), 200),
          height: Math.max(Math.floor(pageH), 300),
          usePortrait: true
        };
      }
    }

    function getOrCreateFlipbook() {
      let container = document.getElementById('flipbook');
      const viewport = document.getElementById('book-viewport');
      if (!container || !viewport.contains(container)) {
        if (container) {
          try { container.remove(); } catch (e) {}
        }
        container = document.createElement('div');
        container.id = 'flipbook';
        const trigger = document.getElementById('touch-hud-trigger');
        if (trigger && viewport.contains(trigger)) {
          viewport.insertBefore(container, trigger);
        } else {
          viewport.appendChild(container);
        }
      }
      return container;
    }

    function destroyCurrentBook() {
      if (pageFlip) {
        try {
          pageFlip.destroy();
        } catch (e) {
          console.warn('pageFlip destroy error:', e);
        }
        pageFlip = null;
      }
      const container = getOrCreateFlipbook();
      container.innerHTML = '';
      return container;
    }

    // Build PageFlip instance
    function createPageFlipInstance(width, height, usePortrait, startPage = 0) {
      resetZoom();
      const container = destroyCurrentBook();
      container.style.display = 'block';

      const safeW = Math.max(width || 360, 200);
      const safeH = Math.max(height || 600, 300);

      pageFlip = new St.PageFlip(container, {
        startPage: startPage || 0,
        width: safeW,
        height: safeH,
        size: 'fixed',
        minWidth: 200,
        maxWidth: 2400,
        minHeight: 300,
        maxHeight: 2800,
        drawShadow: currentTheme !== 'eink',
        flippingTime: currentTheme === 'eink' ? 120 : 600,
        usePortrait: usePortrait,
        startZIndex: 5,
        autoSize: true,
        maxShadowOpacity: 0.55,
        showCover: true,
        mobileScrollSupport: false,
        swipeDistance: 25,
        clickEventForward: false,
        useMouseEvents: true,
        showPageCorners: true
      });

      pageFlip.on('flip', (e) => {
        resetZoom();
        updatePageIndicator(e.data);
        saveBookProgress(currentBookId, e.data);
      });

      pageFlip.on('changeState', (e) => {
        if (e.data === 'flipping') {
          playFlipSound();
        }
      });

      window.pageFlip = pageFlip;
      return pageFlip;
    }

    // ==========================================
    // PINCH-TO-ZOOM & PAN SYSTEM
    // ==========================================
    let currentScale = 1;
    let currentPanX = 0;
    let currentPanY = 0;
    let pinchStartDist = 0;
    let pinchStartScale = 1;
    let lastTouchPoint = { x: 0, y: 0 };
    let isPinching = false;
    let isPanning = false;
    let lastTapTime = 0;

    function applyZoomTransform(animate = false) {
      const flipbook = document.getElementById('flipbook');
      if (!flipbook) return;
      if (animate) {
        flipbook.style.transition = 'transform 0.25s cubic-bezier(0.2, 0, 0, 1)';
      } else {
        flipbook.style.transition = 'none';
      }
      flipbook.style.transform = `translate3d(${currentPanX}px, ${currentPanY}px, 0) scale(${currentScale})`;

      const resetBtn = document.getElementById('zoom-reset-btn');
      if (resetBtn) {
        if (currentScale > 1.05) {
          resetBtn.style.display = 'block';
          resetBtn.innerText = `🔍 ${currentScale.toFixed(1)}x (Сброс)`;
        } else {
          resetBtn.style.display = 'none';
        }
      }
    }

    function clampPan() {
      const vp = document.getElementById('book-viewport');
      const w = vp ? vp.clientWidth : window.innerWidth;
      const h = vp ? vp.clientHeight : window.innerHeight;
      const maxPanX = Math.max((w * (currentScale - 1)) / 2 + 80, 0);
      const maxPanY = Math.max((h * (currentScale - 1)) / 2 + 80, 0);
      currentPanX = Math.min(Math.max(currentPanX, -maxPanX), maxPanX);
      currentPanY = Math.min(Math.max(currentPanY, -maxPanY), maxPanY);
    }

    function resetZoom() {
      currentScale = 1;
      currentPanX = 0;
      currentPanY = 0;
      applyZoomTransform(true);
    }

    function initPinchZoom() {
      const vp = document.getElementById('book-viewport');
      if (!vp) return;

      vp.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          isPinching = true;
          isPanning = false;
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          pinchStartDist = Math.hypot(dx, dy);
          pinchStartScale = currentScale;
          e.stopPropagation();
          e.preventDefault();
        } else if (e.touches.length === 1) {
          isPinching = false;
          const touch = e.touches[0];
          const now = Date.now();

          // Double tap detection
          if (now - lastTapTime < 300) {
            lastTapTime = 0;
            if (currentScale > 1.1) {
              resetZoom();
            } else {
              currentScale = 2.2;
              const cx = window.innerWidth / 2;
              const cy = window.innerHeight / 2;
              currentPanX = (cx - touch.clientX) * 0.8;
              currentPanY = (cy - touch.clientY) * 0.8;
              clampPan();
              applyZoomTransform(true);
            }
            e.stopPropagation();
            e.preventDefault();
            return;
          }
          lastTapTime = now;

          if (currentScale > 1.05) {
            isPanning = true;
            lastTouchPoint = { x: touch.clientX, y: touch.clientY };
            e.stopPropagation();
            e.preventDefault();
          } else {
            isPanning = false;
          }
        }
      }, { capture: true, passive: false });

      vp.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && isPinching) {
          e.stopPropagation();
          e.preventDefault();
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.hypot(dx, dy);
          if (pinchStartDist > 0) {
            const factor = dist / pinchStartDist;
            currentScale = Math.min(Math.max(pinchStartScale * factor, 1.0), 3.5);
            clampPan();
            applyZoomTransform(false);
          }
        } else if (e.touches.length === 1 && currentScale > 1.05 && isPanning) {
          e.stopPropagation();
          e.preventDefault();
          const touch = e.touches[0];
          const dx = touch.clientX - lastTouchPoint.x;
          const dy = touch.clientY - lastTouchPoint.y;
          lastTouchPoint = { x: touch.clientX, y: touch.clientY };
          currentPanX += dx;
          currentPanY += dy;
          clampPan();
          applyZoomTransform(false);
        }
      }, { capture: true, passive: false });

      vp.addEventListener('touchend', (e) => {
        if (isPinching && e.touches.length < 2) {
          isPinching = false;
          if (currentScale < 1.05) {
            resetZoom();
          } else {
            clampPan();
            applyZoomTransform(true);
          }
          e.stopPropagation();
          e.preventDefault();
        } else if (isPanning && e.touches.length === 0) {
          isPanning = false;
          if (currentScale < 1.05) {
            resetZoom();
          } else {
            clampPan();
            applyZoomTransform(true);
          }
        }
      }, { capture: true, passive: false });
    }

    // ==========================================
    // LIBRARY & BOOKSHELF SYSTEM
    // ==========================================
    const STORAGE_LIBRARY_KEY = 'paperbook_library_v1';
    const STORAGE_LAST_BOOK_ID = 'paperbook_last_book_id';
    let currentBookId = null;

    function getStoredLibrary() {
      try {
        const raw = localStorage.getItem(STORAGE_LIBRARY_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        console.error('Error reading library:', e);
        return [];
      }
    }

    function saveStoredLibrary(list) {
      try {
        localStorage.setItem(STORAGE_LIBRARY_KEY, JSON.stringify(list));
      } catch (e) {
        console.error('Error saving library:', e);
      }
    }

    function saveBookProgress(bookId, pageIndex) {
      if (!bookId || bookId === 'demo') return;
      const list = getStoredLibrary();
      const book = list.find(b => b.id === bookId);
      if (book) {
        book.lastPage = pageIndex;
        book.lastReadTime = Date.now();
        saveStoredLibrary(list);
      }
    }

    function deleteBookFromShelf(bookId) {
      if (!confirm('Удалить эту книгу из библиотеки?')) return;
      let list = getStoredLibrary();

      saveStoredLibrary(list);

      if (window.AndroidBridge && window.AndroidBridge.deleteBook) {
        window.AndroidBridge.deleteBook(bookId);

      if (currentBookId === bookId) {
        currentBookId = null;
        localStorage.removeItem(STORAGE_LAST_BOOK_ID);
        renderedPageImages = [];
        destroyCurrentBook();

      renderBookshelf();

    async function openBookFromShelf(bookId) {
      const list = getStoredLibrary();
      const book = list.find(b => b.id === bookId);
      if (!book) return;

      currentBookId = book.id;
      localStorage.setItem(STORAGE_LAST_BOOK_ID, book.id);
      closeBookshelf();
      await loadPdfDocument(book.url, book.title, book.lastPage || 0);

    // PDF Rendering Engine
    let renderedPageImages = [];

    function buildBookFromImages(images, dim, targetPage = 0) {
      const pf = createPageFlipInstance(dim.width, dim.height, dim.usePortrait, targetPage);
      const container = getOrCreateFlipbook();
      container.style.width = (dim.usePortrait ? dim.width : dim.width * 2) + 'px';
      container.style.height = dim.height + 'px';

      images.forEach((imgSrc) => {
        const pageDiv = document.createElement('div');
        pageDiv.className = 'page';
        pageDiv.style.width = dim.width + 'px';
        pageDiv.style.height = dim.height + 'px';
        pageDiv.style.backgroundColor = currentTheme === 'amoled' ? '#121214' : '#FFFFFF';
        pageDiv.style.display = 'flex';
        pageDiv.style.alignItems = 'center';
        pageDiv.style.justifyContent = 'center';
        pageDiv.style.overflow = 'hidden';

        const img = document.createElement('img');
        img.src = imgSrc;
        img.style.width = '100%';
        img.style.height = '100%';
        img.style.objectFit = 'contain';
        pageDiv.appendChild(img);
        container.appendChild(pageDiv);
      });

      pf.loadFromHTML(container.querySelectorAll('.page'));
      if (targetPage > 0) {
        try {
          setTimeout(() => {
            pf.flip(targetPage);
          }, 60);
        } catch (e) {}
      }
      window.renderedPageImages = images;
      return pf;
    }

    async function loadPdfDocument(source, docTitle, targetPage = 0) {
      showLoading('Открытие документа PDF...');
      try {
        const loadingTask = (typeof source === 'string')
          ? pdfjsLib.getDocument({ url: source })
          : pdfjsLib.getDocument({ data: source });
        pdfDoc = await loadingTask.promise;
        totalPages = pdfDoc.numPages;
        renderedPageImages = [];

        document.getElementById('hud-book-title').innerText = docTitle || ('PDF Книга (' + totalPages + ' стр.)');
        document.getElementById('page-slider').max = Math.max(totalPages - 1, 0);

        // Detect page 1 aspect ratio
        try {
          const firstPage = await pdfDoc.getPage(1);
          const vp = firstPage.getViewport({ scale: 1 });
          if (vp.width && vp.height) {
            currentPdfRatio = vp.width / vp.height;
          }
        } catch (e) {
          console.warn('Could not detect ratio from page 1:', e);
        }

        const dim = getBookDimensions();
        const dpr = Math.min(window.devicePixelRatio || 2, 2.5);
        const targetW = dim.width * dpr;

        for (let i = 1; i <= totalPages; i++) {
          const page = await pdfDoc.getPage(i);
          const viewport = page.getViewport({ scale: 1 });
          const scale = targetW / viewport.width;
          const scaledViewport = page.getViewport({ scale: scale });

          const canvas = document.createElement('canvas');
          canvas.width = scaledViewport.width;
          canvas.height = scaledViewport.height;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          await page.render({
            canvasContext: ctx,
            viewport: scaledViewport
          }).promise;

          renderedPageImages.push(canvas.toDataURL('image/jpeg', 0.90));
          const pct = Math.round((i / totalPages) * 100);
          document.getElementById('loading-text').innerText = 'Рендеринг: ' + pct + '% (' + i + ' / ' + totalPages + ')';
          // Yield to UI loop
          await new Promise(r => setTimeout(r, 0));
        }

        const safeTargetPage = Math.min(Math.max(targetPage || 0, 0), totalPages - 1);
        buildBookFromImages(renderedPageImages, dim, safeTargetPage);
        updatePageIndicator(safeTargetPage);
        hideLoading();
        hideHud();
      } catch (err) {
        console.error('loadPdfDocument error:', err);
        alert('Ошибка при открытии PDF: ' + (err.message || err));
        hideLoading();
      }
    }

    // Native Bridge / SAF File Picker
    function triggerPickPdf() {
      hideHud();
      if (window.AndroidBridge && window.AndroidBridge.pickPdf) {
        window.AndroidBridge.pickPdf();
      } else {
        document.getElementById('hidden-file-input').click();
      }
    }

    function onLocalFilePicked(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const typedArray = new Uint8Array(evt.target.result);
        const bookId = 'local_' + Date.now();
        currentBookId = bookId;
        loadPdfDocument(typedArray, file.name, 0);
      };
      reader.readAsArrayBuffer(file);
    }

    // Android interface hooks
    window.onBookAdded = async function(bookId, fileName, bookUrl) {
      showLoading('Добавление в библиотеку...');
      try {
        const loadingTask = pdfjsLib.getDocument({ url: bookUrl });
        const pdf = await loadingTask.promise;
        const numPages = pdf.numPages;

        let thumbnail = '';
        try {
          const page1 = await pdf.getPage(1);
          const vp = page1.getViewport({ scale: 0.35 });
          const thumbCanvas = document.createElement('canvas');
          thumbCanvas.width = vp.width;
          thumbCanvas.height = vp.height;
          const tCtx = thumbCanvas.getContext('2d');
          tCtx.fillStyle = '#FFFFFF';
          tCtx.fillRect(0, 0, vp.width, vp.height);
          await page1.render({ canvasContext: tCtx, viewport: vp }).promise;
          thumbnail = thumbCanvas.toDataURL('image/jpeg', 0.85);
        } catch (e) {
          console.warn('Cover generation error:', e);
        }

        const list = getStoredLibrary();
        const existingIdx = list.findIndex(b => b.id === bookId);
        const entry = {
          id: bookId,
          title: fileName,
          url: bookUrl,
          totalPages: numPages,
          lastPage: 0,
          lastReadTime: Date.now(),
          coverThumbnail: thumbnail
        };
        if (existingIdx >= 0) {
          list[existingIdx] = entry;
        } else {
          list.push(entry);
        }
        saveStoredLibrary(list);

        currentBookId = bookId;
        localStorage.setItem(STORAGE_LAST_BOOK_ID, bookId);
        closeBookshelf();
        await loadPdfDocument(bookUrl, fileName, 0);
      } catch (err) {
        console.error('onBookAdded error:', err);
        hideLoading();
        alert('Ошибка при сохранении книги: ' + (err.message || err));
      }
    };

    window.loadPdfFromUrl = function(pdfUrl, fileName) {
      loadPdfDocument(pdfUrl, fileName, 0);
    };

    window.loadPdfFromBase64 = function(base64Str, fileName) {
      try {
        const binaryString = window.atob(base64Str);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        loadPdfDocument(bytes, fileName, 0);
      } catch (e) {
        alert('Ошибка декодирования файла: ' + e.message);
      }
    };

    function recalculateAndRebuild() {
      resetZoom();
      if (renderedPageImages.length > 0) {
        const dim = getBookDimensions();
        buildBookFromImages(renderedPageImages, dim, currentPageIndex);
      } else {
        renderDemoBook();
      }
    }

    function showLoading(text) {
      const el = document.getElementById('loading-overlay');
      document.getElementById('loading-text').innerText = text;
      el.style.display = 'flex';
      el.style.opacity = '1';
    }

    function hideLoading() {
      const el = document.getElementById('loading-overlay');
      el.style.opacity = '0';
      setTimeout(() => {
        el.style.display = 'none';
      }, 300);
    }

    // Initialize on window load
    window.addEventListener('load', () => {
      initWebAudio();
      initPinchZoom();
      setTimeout(() => {
        const list = getStoredLibrary();
        const lastBookId = localStorage.getItem(STORAGE_LAST_BOOK_ID);
        if (lastBookId && lastBookId !== 'demo' && list.some(b => b.id === lastBookId)) {
          openBookFromShelf(lastBookId);
        } else if (list.length > 0) {
          openBookshelf();
        } else {
          renderDemoBook();
        }

        if (window.AndroidBridge && window.AndroidBridge.onViewerReady) {
          window.AndroidBridge.onViewerReady();
        }
      }, 100);
    });

    window.addEventListener('resize', () => {
      clearTimeout(window._resizeTimer);
      window._resizeTimer = setTimeout(recalculateAndRebuild, 250);
    });

    // Tap outside HUD closes it
    document.addEventListener('click', (e) => {
      if (hudVisible && !e.target.closest('.hud-panel') && !e.target.closest('#touch-hud-trigger')) {
        hideHud();
      }
    });
  </script>
</body>
</html>

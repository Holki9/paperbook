<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PaperBook</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      --bg-desk: #18181b;
      --hud-bg: rgba(24, 24, 27, 0.88);
      --hud-border: rgba(255, 255, 255, 0.12);
      --hud-text: #f4f4f5;
      --hud-accent: #e4e4e7;
      --hud-accent-bg: rgba(255, 255, 255, 0.16);
      --page-paper-bg: #faf8f5;
    }

    body[data-theme="original"], body[data-theme="paper"] {
      --bg-desk: #141416;
      --hud-bg: rgba(24, 24, 27, 0.90);
      --hud-border: rgba(255, 255, 255, 0.12);
      --hud-text: #f4f4f5;
      --hud-accent: #e4e4e7;
      --hud-accent-bg: rgba(255, 255, 255, 0.16);
      --page-paper-bg: #faf8f5;
    }

    body[data-theme="warm"] {
      --bg-desk: #1c1917;
      --hud-bg: rgba(28, 25, 23, 0.92);
      --hud-border: rgba(245, 245, 244, 0.15);
      --hud-text: #f5f5f4;
      --hud-accent: #fbbf24;
      --hud-accent-bg: rgba(251, 191, 36, 0.18);
      --page-paper-bg: #f5ebd7;
    }

    body[data-theme="night"], body[data-theme="amoled"] {
      --bg-desk: #000000;
      --hud-bg: rgba(14, 14, 14, 0.94);
      --hud-border: rgba(255, 255, 255, 0.12);
      --hud-text: #e4e4e7;
      --hud-accent: #38bdf8;
      --hud-accent-bg: rgba(56, 189, 248, 0.18);
      --page-paper-bg: #141416;
    }

    body[data-theme="sharp"] {
      --bg-desk: #111113;
      --hud-bg: rgba(20, 20, 24, 0.92);
      --hud-border: rgba(255, 255, 255, 0.14);
      --hud-text: #ffffff;
      --hud-accent: #a78bfa;
      --hud-accent-bg: rgba(167, 139, 250, 0.2);
      --page-paper-bg: #ffffff;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-desk);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: background-color 0.3s ease;
    }

    #app-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #book-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #flipbook {
      display: block;
      margin: auto;
    }

    .page, .stf__item {
      background-color: var(--page-paper-bg) !important;
      overflow: hidden;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.35);
    }

    .stf__backface_copy {
      background-color: var(--page-paper-bg) !important;
    }

    .stf__backface_copy img {
      transform: scaleX(-1);
      filter: brightness(0.96) contrast(0.98);
      opacity: 0.97;
    }

    /* High quality reading filters - natural tones without negative inversion or grayscale */
    body[data-theme="original"] .stf__parent canvas,
    body[data-theme="original"] .stf__item img,
    body[data-theme="paper"] .stf__parent canvas,
    body[data-theme="paper"] .stf__item img {
      filter: none;
    }

    body[data-theme="warm"] .stf__parent canvas,
    body[data-theme="warm"] .stf__item img {
      filter: sepia(0.24) brightness(0.96) saturate(0.92);
    }

    body[data-theme="night"] .stf__parent canvas,
    body[data-theme="night"] .stf__item img,
    body[data-theme="amoled"] .stf__parent canvas,
    body[data-theme="amoled"] .stf__item img {
      filter: brightness(0.80) contrast(1.03);
    }

    body[data-theme="sharp"] .stf__parent canvas,
    body[data-theme="sharp"] .stf__item img {
      filter: contrast(1.24) brightness(1.0);
    }

    .hud-btn svg, .shelf-add-btn svg, .theme-btn svg {
      vertical-align: middle;
      flex-shrink: 0;
    }

    /* Tap zone in middle handled dynamically without overlay blocking gestures */

    /* Minimalist Floating HUD */
    .hud-panel {
      position: absolute;
      z-index: 100;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: var(--hud-bg);
      border: 1px solid var(--hud-border);
      color: var(--hud-text);
      transition: opacity 0.25s ease, transform 0.25s ease;
      opacity: 0;
      pointer-events: none;
    }

    .hud-panel.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* Top Floating Island (Slim, Ultra-Clean) */
    #hud-top {
      top: calc(env(safe-area-inset-top, 16px) + 8px);
      left: 16px;
      right: 16px;
      max-width: 440px;
      margin: 0 auto;
      padding: 6px 12px 6px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-radius: 22px;
      background: var(--hud-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--hud-border);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.45);
      transform: translateY(-80px);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }

    #hud-top.visible {
      transform: translateY(0);
    }

    .book-title-tag {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      text-align: center;
      color: var(--hud-text);
      opacity: 0.95;
    }

    .hud-icon-btn {
      background: var(--hud-accent-bg);
      border: 1px solid var(--hud-border);
      color: var(--hud-text);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .hud-pill-btn {
      background: var(--hud-accent-bg);
      border: 1px solid var(--hud-border);
      color: var(--hud-text);
      padding: 6px 12px;
      border-radius: 18px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .hud-icon-btn:active, .hud-pill-btn:active {
      transform: scale(0.92);
      opacity: 0.8;
    }

    /* Bottom Floating Island - Single Sleek Air Row */
    #hud-bottom {
      bottom: calc(env(safe-area-inset-bottom, 16px) + 12px);
      left: 16px;
      right: 16px;
      max-width: 440px;
      margin: 0 auto;
      padding: 6px 10px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-radius: 26px;
      background: var(--hud-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--hud-border);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
      transform: translateY(100px);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }

    #hud-bottom.visible {
      transform: translateY(0);
    }

    /* Page Counter Button */
    .page-counter-btn {
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      padding: 6px 12px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--hud-border);
      color: var(--hud-text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .page-counter-btn:active {
      transform: scale(0.94);
      background: rgba(255, 255, 255, 0.16);
    }

    /* Compact Segmented Theme Switcher */
    .theme-segmented {
      display: flex;
      gap: 2px;
      background: rgba(0, 0, 0, 0.35);
      padding: 3px;
      border-radius: 20px;
      border: 1px solid var(--hud-border);
    }

    .theme-chip {
      background: transparent;
      border: none;
      color: var(--hud-text);
      opacity: 0.65;
      padding: 5px 9px;
      border-radius: 16px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .theme-chip.active {
      background: var(--hud-accent-bg);
      color: var(--hud-accent);
      opacity: 1;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    }

    .theme-chip:active {
      transform: scale(0.95);
    }

    /* Loading Overlay */
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg-desk);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 200;
      color: var(--hud-text);
      transition: opacity 0.3s ease;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: var(--hud-text);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loading-text {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    /* Page styling for demo book */
    .demo-page {
      background-color: #FDFBF7;
      color: #27272a;
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      font-family: "Georgia", "Times New Roman", serif;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.05);
    }

    .demo-header {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #71717a;
      text-align: center;
      border-bottom: 1px solid #e4e4e7;
      padding-bottom: 12px;
    }

    .demo-title {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.3;
      margin: 20px 0 14px 0;
      text-align: center;
      color: #18181b;
    }

    .demo-body {
      font-size: 15px;
      line-height: 1.75;
      text-align: justify;
      color: #3f3f46;
      flex: 1;
    }

    .demo-body p {
      margin-bottom: 14px;
      text-indent: 1.5em;
    }

    .demo-footer {
      font-size: 12px;
      text-align: center;
      color: #a1a1aa;
      border-top: 1px solid #f4f4f5;
      padding-top: 10px;
    }

    .cta-card {
      background: #f4f4f5;
      border: 1px dashed #d4d4d8;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-top: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .cta-btn {
      background: #18181b;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 12px;
      cursor: pointer;
      display: inline-block;
    }

    /* Fallback file input */
    #hidden-file-input {
      display: none;
    }

    /* Bookshelf Screen */
    #bookshelf-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-desk);
      z-index: 150;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      color: var(--hud-text);
      transition: opacity 0.25s ease;
    }

    #bookshelf-view.hidden {
      display: none;
      opacity: 0;
      pointer-events: none;
    }

    #bookshelf-header {
      padding: calc(env(safe-area-inset-top, 16px) + 16px) 20px 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--hud-border);
      position: sticky;
      top: 0;
      background: var(--hud-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 10;
    }

    .shelf-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .shelf-brand-icon {
      font-size: 24px;
    }

    .shelf-brand-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    .shelf-add-btn {
      background: var(--hud-accent-bg);
      border: 1px solid var(--hud-border);
      color: var(--hud-text);
      padding: 10px 16px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .shelf-add-btn:active {
      transform: scale(0.96);
    }

    #bookshelf-content {
      padding: 20px;
      flex: 1;
      padding-bottom: 60px;
    }

    #bookshelf-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    @media (min-width: 600px) {
      #bookshelf-grid {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 20px;
      }
    }

    .book-card {
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--hud-border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
    }

    .book-card:active {
      transform: scale(0.97);
    }

    .book-cover-container {
      width: 100%;
      aspect-ratio: 0.68;
      background: #111113;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .book-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .book-card-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .book-card-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--hud-text);
    }

    .book-card-meta {
      font-size: 11px;
      color: #a1a1aa;
    }

    .book-card-progress {
      height: 4px;
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 4px;
    }

    .book-card-progress-bar {
      height: 100%;
      background: #38bdf8;
      border-radius: 2px;
    }

    .book-card-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 6px;
      z-index: 5;
    }

    .book-action-btn {
      background: rgba(0, 0, 0, 0.70);
      border: 1px solid rgba(255, 255, 255, 0.20);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform 0.15s;
    }

    .book-action-btn:active {
      transform: scale(0.9);
    }

    .book-action-btn.edit-btn {
      color: #e4e4e7;
    }

    .book-action-btn.delete-btn {
      color: #f87171;
    }

    /* Shelf Search Bar */
    .shelf-search-container {
      padding: 12px 20px 8px 20px;
      position: sticky;
      top: 68px;
      background: var(--bg-desk);
      z-index: 9;
    }

    .shelf-search-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--hud-border);
      border-radius: 18px;
      padding: 10px 16px;
      color: var(--hud-text);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .shelf-search-bar input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--hud-text);
      font-size: 14px;
      flex: 1;
      width: 100%;
    }

    .shelf-search-bar input::placeholder {
      color: #71717a;
    }

    .shelf-search-clear {
      background: transparent;
      border: none;
      color: #a1a1aa;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    /* Floating Glass Modals */
    .floating-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .floating-modal-card {
      position: relative;
      z-index: 10;
      background: rgba(24, 24, 28, 0.94);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 24px;
      width: calc(100vw - 48px);
      max-width: 380px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: modalPop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalPop {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .modal-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 700;
      color: var(--hud-text);
    }

    .modal-input {
      width: 100%;
      box-sizing: border-box;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--hud-border);
      border-radius: 14px;
      padding: 12px 14px;
      color: var(--hud-text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .modal-input:focus {
      border-color: #38bdf8;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .modal-btn {
      padding: 10px 18px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }

    .modal-btn.secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--hud-text);
      border: 1px solid var(--hud-border);
    }

    .modal-btn.primary {
      background: #38bdf8;
      color: #09090b;
    }

    .modal-btn:active {
      transform: scale(0.96);
    }

    .jump-chips-row {
      display: flex;
      gap: 8px;
      margin-top: 2px;
    }

    .jump-chip {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--hud-border);
      color: #d4d4d8;
      border-radius: 10px;
      padding: 7px 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .jump-chip:active {
      background: rgba(255, 255, 255, 0.16);
    }

    #zoom-reset-btn {
      position: absolute;
      bottom: 105px;
      right: 20px;
      z-index: 60;
      background: var(--hud-bg);
      border: 1px solid var(--hud-border);
      color: var(--hud-text);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body data-theme="original">

  <div id="app-container">
    <div id="book-viewport">
      <div id="flipbook"></div>
      <!-- Center tap area to toggle HUD handled in gestures -->
    </div>
    <button id="zoom-reset-btn" onclick="resetZoom()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg><span>1.0x (Сброс)</span></button>
  </div>

  <!-- Bookshelf Screen -->
  <div id="bookshelf-view">
    <div id="bookshelf-header">
      <div class="shelf-brand">
        <span class="shelf-brand-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg></span>
        <span class="shelf-brand-title">Моя библиотека</span>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="shelf-add-btn" onclick="triggerPickPdf()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg> Добавить PDF
        </button>
        <button class="shelf-add-btn" id="shelf-close-btn" style="display: none;" onclick="closeBookshelf()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg> К чтению
        </button>
      </div>
    </div>
    
    <!-- Shelf Search Bar -->
    <div class="shelf-search-container">
      <div class="shelf-search-bar">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="shelf-search-input" placeholder="Поиск книг по названию..." oninput="onSearchLibrary(this.value)">
        <button id="shelf-search-clear" class="shelf-search-clear" onclick="clearLibrarySearch()" style="display: none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
    </div>

    <div id="bookshelf-content">
      <div id="bookshelf-grid"></div>
      <div id="bookshelf-empty" style="text-align: center; margin-top: 80px; color: #a1a1aa; display: none;">
        <div style="margin-bottom: 12px; display: flex; justify-content: center;"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.5;"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg></div>
        <div style="font-size: 18px; font-weight: 600; color: var(--hud-text);" id="bookshelf-empty-title">Библиотека пуста</div>
        <div style="font-size: 13px; margin-top: 8px; line-height: 1.5;" id="bookshelf-empty-text">Нажмите «Добавить PDF» выше,<br>чтобы открыть любимые книги и комиксы.</div>
      </div>
    </div>
  </div>

  <!-- Top Floating HUD Island -->
  <div id="hud-top" class="hud-panel">
    <button class="hud-pill-btn" onclick="openBookshelf()" title="Моя библиотека">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span>Полка</span>
    </button>
    <div class="book-title-tag" id="hud-book-title">PaperBook</div>
    <button class="hud-icon-btn" onclick="openPageJumpModal()" title="Перейти к странице">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    </button>
  </div>

  <!-- Bottom Floating HUD Island (Single Clean Air Row) -->
  <div id="hud-bottom" class="hud-panel">
    <!-- Page Counter / Jump -->
    <button class="page-counter-btn" id="page-counter" onclick="openPageJumpModal()" title="Нажмите для перехода к странице">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
      <span id="page-counter-text">1 / 1</span>
    </button>

    <!-- Compact Theme Switcher -->
    <div class="theme-segmented">
      <button class="theme-chip active" id="btn-theme-original" onclick="setTheme('original')" title="Обычный режим">
        <span>Свет</span>
      </button>
      <button class="theme-chip" id="btn-theme-warm" onclick="setTheme('warm')" title="Тёплая бумага (сепия)">
        <span>Тёплый</span>
      </button>
      <button class="theme-chip" id="btn-theme-night" onclick="setTheme('night')" title="Ночной AMOLED режим">
        <span>Ночь</span>
      </button>
      <button class="theme-chip" id="btn-theme-sharp" onclick="setTheme('sharp')" title="Высокая чёткость">
        <span>Контраст</span>
      </button>
    </div>

    <!-- Sound Toggle -->
    <button class="hud-icon-btn" id="sound-btn" onclick="toggleSound()" title="Вкл/Выкл звук">
      <span id="sound-icon" style="display: flex; align-items: center; justify-content: center;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
      </span>
    </button>
  </div>

  <!-- Floating Page Jump Modal -->
  <div id="page-jump-modal" class="floating-modal" style="display: none;">
    <div class="modal-backdrop" onclick="closePageJumpModal()"></div>
    <div class="floating-modal-card">
      <div class="modal-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <span>Переход к странице</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <input type="number" id="jump-page-input" class="modal-input" placeholder="№ страницы" min="1" max="1" style="font-size: 18px; font-weight: 600; text-align: center;" onkeydown="if(event.key==='Enter') submitPageJump()">
        <span id="jump-total-text" style="font-size: 14px; color: #a1a1aa; white-space: nowrap;">из 1</span>
      </div>
      <div class="jump-chips-row">
        <button class="jump-chip" onclick="quickJumpTo(1)">В начало (1)</button>
        <button class="jump-chip" onclick="quickJumpTo(Math.max(1, Math.round(totalPages/2)))">Середина</button>
        <button class="jump-chip" onclick="quickJumpTo(totalPages)">В конец</button>
      </div>
      <div class="modal-actions">
        <button class="modal-btn secondary" onclick="closePageJumpModal()">Отмена</button>
        <button class="modal-btn primary" onclick="submitPageJump()">Перейти</button>
      </div>
    </div>
  </div>

  <!-- Floating Rename Modal -->
  <div id="rename-modal" class="floating-modal" style="display: none;">
    <div class="modal-backdrop" onclick="closeRenameModal()"></div>
    <div class="floating-modal-card">
      <div class="modal-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
        <span>Переименовать книгу</span>
      </div>
      <input type="text" id="rename-input" class="modal-input" placeholder="Введите название..." maxlength="100" onkeydown="if(event.key==='Enter') submitRenameBook()">
      <div class="modal-actions">
        <button class="modal-btn secondary" onclick="closeRenameModal()">Отмена</button>
        <button class="modal-btn primary" onclick="submitRenameBook()">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Loading Indicator -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">Загрузка книги...</div>
  </div>

    let audioCtx = null;
    let audioBuffer = null;
    let hudTimer = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function initWebAudio() {
      try {
        const ctx = getAudioContext();
        if (ctx && !audioBuffer) {
          fetch(PAGE_FLIP_B64)
            .then(res => res.arrayBuffer())
            .then(buf => ctx.decodeAudioData(buf))
            .then(decoded => {
              audioBuffer = decoded;
            })
            .catch(() => {});
        }
      } catch (e) {
        console.warn('initWebAudio error:', e);
      }
    }

    // Global audio unlock on first user gesture
    ['touchstart', 'touchend', 'mousedown', 'pointerdown'].forEach(evtName => {
      window.addEventListener(evtName, () => {
        const ctx = getAudioContext();
        if (ctx && !audioBuffer) {
          initWebAudio();
        }
      }, { passive: true });
    });

    function playFlipSound() {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        if (ctx && audioBuffer) {
          if (ctx.state === 'suspended') ctx.resume().catch(() => {});
          const source = ctx.createBufferSource();
          source.buffer = audioBuffer;
          source.playbackRate.value = 0.94 + Math.random() * 0.12;
          const gain = ctx.createGain();
          gain.gain.value = 1.0;
          source.connect(gain);
          gain.connect(ctx.destination);
          source.start(0);
          return;
        }
      } catch (e) {}

      if (flipAudio) {
        try {
          flipAudio.currentTime = 0;
          flipAudio.play().catch(() => {});
        } catch (e) {}
      }
    }

    // Clean title formatter (removes technical suffixes/prefixes like 07_, .pdf)
    function formatDisplayTitle(rawTitle) {
      if (!rawTitle) return 'PaperBook';
      let t = rawTitle.replace(/\.pdf$/i, '');
      t = t.replace(/^([\d]+[\s._-]+|\[.*?\]\s*)/, '');
      t = t.replace(/_/g, ' ');
      t = t.replace(/\s+/g, ' ').trim();
      return t || rawTitle;
    }

    function resetHudTimer() {
      clearTimeout(hudTimer);
      if (hudVisible) {
        hudTimer = setTimeout(() => {
          hideHud();
        }, 4500);
      }
    }

    // Toggle HUD
    function toggleHud() {
      if (currentScale > 1.05) return;
      hudVisible = !hudVisible;
      document.getElementById('hud-top').classList.toggle('visible', hudVisible);
      document.getElementById('hud-bottom').classList.toggle('visible', hudVisible);
      if (hudVisible) resetHudTimer();
    }

    function showHud() {
      if (currentScale > 1.05) return;
      hudVisible = true;
      document.getElementById('hud-top').classList.add('visible');
      document.getElementById('hud-bottom').classList.add('visible');
      resetHudTimer();
    }

    function hideHud() {
      if (hudVisible) {
        hudVisible = false;
        document.getElementById('hud-top').classList.remove('visible');
        document.getElementById('hud-bottom').classList.remove('visible');
      }
    }

    // Reading Tone Modes (Original, Warm, Night, Sharp)
    function setTheme(theme) {
      if (theme === 'paper') theme = 'original';
      if (theme === 'amoled') theme = 'night';
      if (theme === 'eink') theme = 'warm';
      currentTheme = theme;
      document.body.setAttribute('data-theme', theme);
      document.querySelectorAll('.theme-chip, .theme-btn').forEach(b => b.classList.remove('active'));
      resetHudTimer();
      const btn = document.getElementById('btn-theme-' + theme);
      if (btn) btn.classList.add('active');

      const paperColors = {
        night: '#141416',
        warm: '#f5ebd7',
        sharp: '#ffffff',
        original: '#faf8f5'
      };
      const currentColor = paperColors[theme] || '#faf8f5';
      document.querySelectorAll('.page, .stf__item').forEach(el => {
        el.style.backgroundColor = currentColor;
      });

      if (pageFlip) {
        try {
          pageFlip.getSettings().flippingTime = 600;
          pageFlip.getSettings().drawShadow = true;
          pageFlip.update();
        } catch (e) {
          console.warn('pageFlip update on theme switch error:', e);
        }
      }
      try {
        localStorage.setItem('paperbook_theme', theme);
      } catch (e) {}
    }

    // Sound toggle
    function updateSoundIconUI() {
      const el = document.getElementById('sound-icon');
      if (!el) return;
      if (soundEnabled) {
        el.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>';
      } else {
        el.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>';
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      updateSoundIconUI();
    }

    // Fast Page Scrubber & Page Indicator
    function onSliderChange(val) {
      val = parseInt(val, 10);
      if (pageFlip && val !== currentPageIndex && val >= 0 && val < totalPages) {
        pageFlip.turnToPage(val);
        updatePageIndicator(val);
        playFlipSound();
      }
    }

    function updatePageIndicator(pageIdx) {
      currentPageIndex = pageIdx;
      const total = Math.max(totalPages, 1);
      const counterText = document.getElementById('page-counter-text');
      if (counterText) {
        counterText.innerText = (pageIdx + 1) + ' / ' + total;

    // Floating Page Jump Modal
    function openPageJumpModal() {

    function submitPageJump() {
      const input = document.getElementById('jump-page-input');
      if (!input) return;
      const target = parseInt(input.value, 10);
      if (!isNaN(target) && target >= 1 && target <= totalPages) {
        jumpToPage(target - 1);
        closePageJumpModal();
      }
    }

    function quickJumpTo(pageOneBased) {
      const p = Math.max(1, Math.min(pageOneBased, totalPages));
      jumpToPage(p - 1);

    function jumpToPage(pageIdx) {
      if (pageFlip && pageIdx >= 0 && pageIdx < totalPages) {
        pageFlip.turnToPage(pageIdx);
        updatePageIndicator(pageIdx);
        playFlipSound();
      }
    }

    let currentPdfRatio = 0.68;

    // Calculate dimensions matching device screen aspect ratio
    function getBookDimensions() {
      let w = window.innerWidth || document.documentElement.clientWidth || screen.width || 412;
      let h = window.innerHeight || document.documentElement.clientHeight || screen.height || 915;
      if (w <= 0) w = 412;
      if (h <= 0) h = 915;
      const isLandscape = w > h;
      const ratio = currentPdfRatio || 0.68;

      if (isLandscape && !forceSinglePage) {
        // Two page spread in landscape
        const maxBookW = w * 0.98;
        const maxBookH = h * 0.96;
        let spreadW, spreadH;
        if (maxBookW / maxBookH < ratio * 2) {
          spreadW = maxBookW;
          spreadH = spreadW / (ratio * 2);
        } else {
          spreadH = maxBookH;
          spreadW = spreadH * (ratio * 2);
        }
        const singleW = Math.max(Math.floor(spreadW / 2), 200);
        const finalH = Math.max(Math.floor(spreadH), 300);
        return {
          width: singleW,
          height: finalH,
          usePortrait: false
        };
      } else {
        // Single page portrait
        const maxW = w * 0.98;
        const maxH = h * 0.96;
        let pageW, pageH;
        if (maxW / maxH < ratio) {
          pageW = maxW;
          pageH = pageW / ratio;
        } else {
          pageH = maxH;
          pageW = pageH * ratio;
        }
        return {
          width: Math.max(Math.floor(pageW), 200),
          height: Math.max(Math.floor(pageH), 300),
          usePortrait: true
        };
      }
    }

    function getOrCreateFlipbook() {
      let container = document.getElementById('flipbook');
      const viewport = document.getElementById('book-viewport');
      if (!container || !viewport.contains(container)) {
        if (container) {
          try { container.remove(); } catch (e) {}
        }
        container = document.createElement('div');
        container.id = 'flipbook';
        const trigger = document.getElementById('touch-hud-trigger');
        if (trigger && viewport.contains(trigger)) {
          viewport.insertBefore(container, trigger);
        } else {
          viewport.appendChild(container);
        }
      }
      return container;
    }

    function destroyCurrentBook() {
      if (pageFlip) {
        try {
          pageFlip.destroy();
        } catch (e) {
          console.warn('pageFlip destroy error:', e);
        }
        pageFlip = null;
      }
      memoryTextureCache.clear();
      backgroundRenderQueue = [];
      isBackgroundWorkerRunning = false;
      isGestureOrAnimationActive = false;
      const container = getOrCreateFlipbook();
      container.innerHTML = '';
      return container;
    }

    // Build PageFlip instance
    function createPageFlipInstance(width, height, usePortrait, startPage = 0) {
      resetZoom();
      const container = destroyCurrentBook();
      container.style.display = 'block';

      const safeW = Math.max(width || 360, 200);
      const safeH = Math.max(height || 600, 300);

      pageFlip = new St.PageFlip(container, {
        startPage: startPage || 0,
        width: safeW,
        height: safeH,
        size: 'fixed',
        minWidth: 200,
        maxWidth: 2400,
        minHeight: 300,
        maxHeight: 2800,
        drawShadow: true,
        flippingTime: 600,
        usePortrait: usePortrait,
        startZIndex: 5,
        autoSize: true,
        maxShadowOpacity: 0.55,
        showCover: true,
        mobileScrollSupport: false,
        swipeDistance: 25,
        clickEventForward: false,
        useMouseEvents: true,
        showPageCorners: true,
        disableFlipByClick: true
      });

      pageFlip.on('flip', (e) => {
        resetZoom();
        updatePageIndicator(e.data);
        saveBookProgress(currentBookId, e.data);
        playFlipSound();
        setGestureOrAnimationActive(false);
        updateSlidingWindow(e.data);
      });

      pageFlip.on('changeState', (e) => {
        if (e.data === 'flipping' || e.data === 'user_fold' || e.data === 'fold_corner') {
          setGestureOrAnimationActive(true);
          playFlipSound();
        } else if (e.data === 'read') {
          setGestureOrAnimationActive(false);
          updateSlidingWindow(currentPageIndex);
        }
      });

      container.addEventListener('touchstart', () => setGestureOrAnimationActive(true), { passive: true });
      container.addEventListener('touchend', () => {
        setTimeout(() => {
          if (pageFlip && pageFlip.getState() === 'read') {
            setGestureOrAnimationActive(false);
            updateSlidingWindow(currentPageIndex);
          }
        }, 120);
      }, { passive: true });

      window.pageFlip = pageFlip;
      return pageFlip;
    }

    // ==========================================
    // PINCH-TO-ZOOM & PAN SYSTEM
    // ==========================================
    let currentScale = 1;
    let currentPanX = 0;
    let currentPanY = 0;
    let pinchStartDist = 0;
    let pinchStartScale = 1;
    let lastTouchPoint = { x: 0, y: 0 };
    let isPinching = false;
    let isPanning = false;
    let lastTapTime = 0;
    let singleTouchStart = null;

    function applyZoomTransform(animate = false) {
      const flipbook = document.getElementById('flipbook');
      if (!flipbook) return;
      if (animate) {
        flipbook.style.transition = 'transform 0.25s cubic-bezier(0.2, 0, 0, 1)';
      } else {
        flipbook.style.transition = 'none';
      }
      flipbook.style.transform = `translate3d(${currentPanX}px, ${currentPanY}px, 0) scale(${currentScale})`;

      const resetBtn = document.getElementById('zoom-reset-btn');
      if (resetBtn) {
        if (currentScale > 1.05) {
          resetBtn.style.display = 'block';
          resetBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>${currentScale.toFixed(1)}x (Сброс)`;
        } else {
          resetBtn.style.display = 'none';
        }
      }
    }

    function clampPan() {
      const vp = document.getElementById('book-viewport');
      const w = vp ? vp.clientWidth : window.innerWidth;
      const h = vp ? vp.clientHeight : window.innerHeight;
      const maxPanX = Math.max((w * (currentScale - 1)) / 2 + 80, 0);
      const maxPanY = Math.max((h * (currentScale - 1)) / 2 + 80, 0);
      currentPanX = Math.min(Math.max(currentPanX, -maxPanX), maxPanX);
      currentPanY = Math.min(Math.max(currentPanY, -maxPanY), maxPanY);
    }

    function resetZoom() {
      currentScale = 1;
      currentPanX = 0;
      currentPanY = 0;
      applyZoomTransform(true);
    }

    function initPinchZoom() {
      const vp = document.getElementById('book-viewport');
      if (!vp) return;

      vp.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          isPinching = true;
          isPanning = false;
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          pinchStartDist = Math.hypot(dx, dy);
          pinchStartScale = currentScale;
          e.stopPropagation();
          e.preventDefault();
        } else if (e.touches.length === 1) {
          isPinching = false;
          const touch = e.touches[0];
          const now = Date.now();

          // Double tap detection
          if (now - lastTapTime < 300) {
            lastTapTime = 0;
            if (currentScale > 1.1) {
              resetZoom();
            } else {
              currentScale = 2.2;
              const cx = window.innerWidth / 2;
              const cy = window.innerHeight / 2;
              currentPanX = (cx - touch.clientX) * 0.8;
              currentPanY = (cy - touch.clientY) * 0.8;
              clampPan();
              applyZoomTransform(true);
            }
            e.stopPropagation();
            e.preventDefault();
            return;
          }
          lastTapTime = now;

          singleTouchStart = { x: touch.clientX, y: touch.clientY, time: now };
          if (currentScale > 1.05) {
            isPanning = true;
            lastTouchPoint = { x: touch.clientX, y: touch.clientY };
            e.stopPropagation();
            e.preventDefault();
          } else {
            isPanning = false;
          }
        }
      }, { capture: true, passive: false });

      vp.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && isPinching) {
          e.stopPropagation();
          e.preventDefault();
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.hypot(dx, dy);
          if (pinchStartDist > 0) {
            const factor = dist / pinchStartDist;
            currentScale = Math.min(Math.max(pinchStartScale * factor, 1.0), 3.5);
            clampPan();
            applyZoomTransform(false);
          }
        } else if (e.touches.length === 1 && currentScale > 1.05 && isPanning) {
          e.stopPropagation();
          e.preventDefault();
          const touch = e.touches[0];
          const dx = touch.clientX - lastTouchPoint.x;
          const dy = touch.clientY - lastTouchPoint.y;
          lastTouchPoint = { x: touch.clientX, y: touch.clientY };
          currentPanX += dx;
          currentPanY += dy;
          clampPan();
          applyZoomTransform(false);
        }
      }, { capture: true, passive: false });

      vp.addEventListener('touchend', (e) => {
        if (isPinching && e.touches.length < 2) {
          isPinching = false;
          if (currentScale < 1.05) {
            resetZoom();
          } else {
            clampPan();
            applyZoomTransform(true);
          }
          e.stopPropagation();
          e.preventDefault();
        } else if (e.touches.length === 0) {
          if (isPanning) {
            isPanning = false;
            if (currentScale < 1.05) {
              resetZoom();
            } else {
              clampPan();
              applyZoomTransform(true);
            }
          } else if (singleTouchStart && currentScale <= 1.05 && e.changedTouches.length > 0) {
            const touch = e.changedTouches[0];
            const dx = Math.abs(touch.clientX - singleTouchStart.x);
            const dy = Math.abs(touch.clientY - singleTouchStart.y);
            const dt = Date.now() - singleTouchStart.time;
            if (dt < 300 && dx < 15 && dy < 15) {
              if (hudVisible) {
                hideHud();
              } else {
                const w = window.innerWidth;
                const h = window.innerHeight;
                if (touch.clientX > w * 0.20 && touch.clientX < w * 0.80 &&
                    touch.clientY > h * 0.20 && touch.clientY < h * 0.80) {
                  showHud();
                }
              }
            }
          }
          singleTouchStart = null;
        }
      }, { capture: true, passive: false });
    }

    // ==========================================
    // LIBRARY & BOOKSHELF SYSTEM
    // ==========================================
    const STORAGE_LIBRARY_KEY = 'paperbook_library_v1';
    const STORAGE_LAST_BOOK_ID = 'paperbook_last_book_id';

        return [];

          const coverHtml = book.coverThumbnail
            ? `<img class="book-cover-img" src="${book.coverThumbnail}" alt="${book.title}" />`
            : `<div style="display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; background: #27272a;"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg></div>`;

          card.innerHTML = `
            <div class="book-card-actions">
              <button class="book-action-btn edit-btn" title="Переименовать" onclick="event.stopPropagation(); openRenameModal('${book.id}')">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
              </button>
              <button class="book-action-btn delete-btn" title="Удалить" onclick="event.stopPropagation(); deleteBookFromShelf('${book.id}')">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
              </button>
            </div>
            <div class="book-cover-container">
              ${coverHtml}
            </div>
            <div class="book-card-info">
              <div class="book-card-title" title="${book.title}">${book.title}</div>
              <div class="book-card-meta">${curPage} из ${book.totalPages} стр. (${pct}%)</div>
              <div class="book-card-progress">
                <div class="book-card-progress-bar" style="width: ${pct}%;"></div>
              </div>
            </div>
          `;

          card.onclick = () => {
            openBookFromShelf(book.id);
          };

          grid.appendChild(card);
        });
      }
    }

    // ==========================================
    // PERSISTENT BOOK CACHE (IndexedDB)
    // ==========================================
    const DB_NAME = 'PaperBookCacheDB_v3';
    const DB_VERSION = 1;
    const STORE_NAME = 'book_pages';

    function openCacheDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'bookId' });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function getCachedBookPages(bookId) {
      if (!bookId) return null;
      try {
        const db = await openCacheDB();
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          const req = store.get(bookId);
          req.onsuccess = () => {
            if (req.result && req.result.images && req.result.images.length > 0) {
              resolve(req.result.images);
            } else {
              resolve(null);
            }
          };
          req.onerror = () => resolve(null);
        });
      } catch (e) {
        console.warn('Error reading from cache DB:', e);
        return null;
      }
    }

    async function saveBookPagesToCache(bookId, images) {
      if (!bookId || !images || images.length === 0) return;
      try {
        const db = await openCacheDB();
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          const store = tx.objectStore(STORE_NAME);
          store.put({ bookId: bookId, images: images, timestamp: Date.now() });
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      } catch (e) {
        console.warn('Error saving to cache DB:', e);
      }
    }

    async function saveSinglePageToCache(bookId, pageIdx, dataUrl) {
      if (!bookId || !dataUrl || pageIdx === undefined) return;
      try {
        const db = await openCacheDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const req = store.get(bookId);
        req.onsuccess = () => {
          let record = req.result;
          if (!record) {
            record = { bookId: bookId, images: new Array(totalPages).fill(null), timestamp: Date.now() };
          }
          if (!record.images || record.images.length !== totalPages) {
            const arr = new Array(totalPages).fill(null);
            if (record.images) {
              for (let i = 0; i < record.images.length; i++) arr[i] = record.images[i];
            }
            record.images = arr;
          }
          record.images[pageIdx] = dataUrl;
          record.timestamp = Date.now();
          store.put(record);
        };
      } catch (e) {}
    }

    async function deleteBookPagesFromCache(bookId) {
      if (!bookId) return;
      try {
        const db = await openCacheDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.delete(bookId);
      } catch (e) {}
    }

    function deleteBookFromShelf(bookId) {
      if (!confirm('Удалить эту книгу из библиотеки?')) return;
      let list = getStoredLibrary();
      list = list.filter(b => b.id !== bookId);
      saveStoredLibrary(list);
      deleteBookPagesFromCache(bookId);

      if (window.AndroidBridge && window.AndroidBridge.deleteBook) {
        window.AndroidBridge.deleteBook(bookId);
      }

      if (currentBookId === bookId) {
        currentBookId = null;
        localStorage.removeItem(STORAGE_LAST_BOOK_ID);
        renderedPageImages = [];
        destroyCurrentBook();
      }

      renderBookshelf();
    }

    async function openBookFromShelf(bookId) {
      const list = getStoredLibrary();
      const book = list.find(b => b.id === bookId);
      if (!book) return;

      currentBookId = book.id;
      localStorage.setItem(STORAGE_LAST_BOOK_ID, book.id);
      closeBookshelf();
      await loadPdfDocument(book.url, book.title, book.lastPage || 0, book.id);
    }

    // PDF Rendering Engine with Sliding Window Memory Cache
    let renderedPageImages = [];
    const TRANSPARENT_PIXEL = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

    async function renderPdfPageToDataUrl(pageNumber) {
      if (!pdfDoc) return null;
      try {
        const page = await pdfDoc.getPage(pageNumber);
        const dim = getBookDimensions();
        const dpr = Math.max(window.devicePixelRatio || 2.5, 2.875);
        const targetW = Math.max(Math.round(dim.width * dpr), 1080);

        const viewport = page.getViewport({ scale: 1 });
        const scale = targetW / viewport.width;
        const scaledViewport = page.getViewport({ scale: scale });

        const canvas = document.createElement('canvas');
        canvas.width = scaledViewport.width;
        canvas.height = scaledViewport.height;
        const ctx = canvas.getContext('2d');

        const isDark = currentTheme === 'night' || currentTheme === 'amoled';
        ctx.fillStyle = isDark ? '#141416' : (currentTheme === 'warm' ? '#f5ebd7' : '#FFFFFF');
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        await page.render({
          canvasContext: ctx,
          viewport: scaledViewport
        }).promise;

        return canvas.toDataURL('image/jpeg', 0.92);
      } catch (err) {
        console.warn('renderPdfPageToDataUrl error on page ' + pageNumber, err);
        return null;
      }
    }

    function updatePageDomTexture(pageIndex, dataUrl) {
      if (!dataUrl) return;
      const pages = document.querySelectorAll('#flipbook .page');
      if (pages && pages[pageIndex]) {
        const img = pages[pageIndex].querySelector('img');
        if (img && img.src !== dataUrl) {
          img.src = dataUrl;
        }
      }
    }

    function updateSlidingWindow(currIdx) {
      if (!pdfDoc || totalPages <= 0) return;
      if (isGestureOrAnimationActive) return;

      const priorityQueue = [];
      // Priority sliding window: N, N+1, N-1, N+2
      if (currIdx >= 0 && currIdx < totalPages && !memoryTextureCache.has(currIdx)) {
        priorityQueue.push(currIdx);
      }
      if (currIdx + 1 < totalPages && !memoryTextureCache.has(currIdx + 1)) {
        priorityQueue.push(currIdx + 1);
      }
      if (currIdx - 1 >= 0 && !memoryTextureCache.has(currIdx - 1)) {
        priorityQueue.push(currIdx - 1);
      }
      if (currIdx + 2 < totalPages && !memoryTextureCache.has(currIdx + 2)) {
        priorityQueue.push(currIdx + 2);
      }

      // Extended lookahead prefetching
      for (let i = 1; i <= 8; i++) {
        const ahead = currIdx + 2 + i;
        if (ahead < totalPages && !memoryTextureCache.has(ahead) && !priorityQueue.includes(ahead)) {
          priorityQueue.push(ahead);
        }
        const behind = currIdx - 1 - i;
        if (behind >= 0 && !memoryTextureCache.has(behind) && !priorityQueue.includes(behind)) {
          priorityQueue.push(behind);
        }
      }

      backgroundRenderQueue = priorityQueue;
      runBackgroundWorker();
    }

    async function runBackgroundWorker() {
      if (isBackgroundWorkerRunning) return;
      isBackgroundWorkerRunning = true;

      while (backgroundRenderQueue.length > 0) {
        // STRICT: Pause decoding immediately during touch gestures or page curl animations
        if (isGestureOrAnimationActive) {
          break;
        }

        const targetIdx = backgroundRenderQueue.shift();
        if (targetIdx === undefined) break;

        if (memoryTextureCache.has(targetIdx)) {
          continue;
        }

        if (isGestureOrAnimationActive) {
          backgroundRenderQueue.unshift(targetIdx);
          break;
        }

        try {
          const dataUrl = await renderPdfPageToDataUrl(targetIdx + 1);
          if (dataUrl) {
            memoryTextureCache.set(targetIdx, dataUrl);
            renderedPageImages[targetIdx] = dataUrl;
            updatePageDomTexture(targetIdx, dataUrl);

            if (currentBookId) {
              saveSinglePageToCache(currentBookId, targetIdx, dataUrl);
            }
          }
        } catch (e) {
          console.warn('Background render error on page ' + targetIdx, e);
        }

        // Yield to browser UI loop so UI stays rock solid 60/120 FPS
        await new Promise(r => setTimeout(r, 20));
      }

      isBackgroundWorkerRunning = false;
    }

    function buildBookFromImages(images, dim, targetPage = 0) {
      const safeTargetPage = Math.min(Math.max(targetPage || 0, 0), images.length - 1);
      const pf = createPageFlipInstance(dim.width, dim.height, dim.usePortrait, safeTargetPage);
      const container = getOrCreateFlipbook();
      container.style.width = (dim.usePortrait ? dim.width : dim.width * 2) + 'px';
      container.style.height = dim.height + 'px';

      const paperColors = {
        night: '#141416',
        warm: '#f5ebd7',
        sharp: '#ffffff',
        original: '#faf8f5'
      };
      const currentColor = paperColors[currentTheme] || '#faf8f5';

      images.forEach((imgSrc, idx) => {
        const pageDiv = document.createElement('div');
        pageDiv.className = 'page';
        pageDiv.style.width = dim.width + 'px';
        pageDiv.style.height = dim.height + 'px';
        pageDiv.style.backgroundColor = currentColor;
        pageDiv.style.display = 'flex';
        pageDiv.style.alignItems = 'center';
        pageDiv.style.justifyContent = 'center';
        pageDiv.style.overflow = 'hidden';

        const img = document.createElement('img');
        const resolvedSrc = memoryTextureCache.get(idx) || imgSrc || TRANSPARENT_PIXEL;
        img.src = resolvedSrc;
        img.style.width = '100%';
        img.style.height = '100%';
        img.style.objectFit = 'contain';
        img.style.willChange = 'transform';
        img.style.transform = 'translateZ(0)';
        img.style.imageRendering = '-webkit-optimize-contrast';
        img.decoding = 'async';
        pageDiv.appendChild(img);
        container.appendChild(pageDiv);
      });

      pf.loadFromHTML(container.querySelectorAll('.page'));
      window.renderedPageImages = images;
      updatePageIndicator(safeTargetPage);
      return pf;
    }

    async function loadPdfDocument(source, docTitle, targetPage = 0, bookId = null) {
      const activeBookId = bookId || currentBookId;
      currentBookId = activeBookId;

      // 1. Instant Open from Cache: Check if pages already rendered and cached!
      if (activeBookId) {
        showLoading('Загрузка из кэша книги...');
        const cachedPages = await getCachedBookPages(activeBookId);
        if (cachedPages && cachedPages.length > 0) {
          renderedPageImages = cachedPages;
          totalPages = cachedPages.length;
          memoryTextureCache.clear();
          for (let i = 0; i < cachedPages.length; i++) {
            if (cachedPages[i] && cachedPages[i].length > 100) {
              memoryTextureCache.set(i, cachedPages[i]);
            }
          }
          document.getElementById('hud-book-title').innerText = formatDisplayTitle(docTitle);

          const dim = getBookDimensions();
          const safeTargetPage = Math.min(Math.max(targetPage || 0, 0), totalPages - 1);
          buildBookFromImages(renderedPageImages, dim, safeTargetPage);
          hideLoading();
          hideHud();
          return;
        }
      }

      showLoading('Открытие документа PDF...');
      try {
        const loadingTask = (typeof source === 'string')
          ? pdfjsLib.getDocument({ url: source })
          : pdfjsLib.getDocument({ data: source });
        pdfDoc = await loadingTask.promise;
        totalPages = pdfDoc.numPages;
        memoryTextureCache.clear();
        renderedPageImages = new Array(totalPages).fill(TRANSPARENT_PIXEL);

        document.getElementById('hud-book-title').innerText = formatDisplayTitle(docTitle);

        // Detect page 1 aspect ratio
        try {
          const firstPage = await pdfDoc.getPage(1);
          const vp = firstPage.getViewport({ scale: 1 });
          if (vp.width && vp.height) {
            currentPdfRatio = vp.width / vp.height;
          }
        } catch (e) {
          console.warn('Could not detect ratio from page 1:', e);
        }

        const dim = getBookDimensions();
        const safeTargetPage = Math.min(Math.max(targetPage || 0, 0), totalPages - 1);

        // Instant Open: Render ONLY the priority sliding window [N, N+1, N+2, N-1] upfront!
        const priorityIndices = [safeTargetPage];
        if (safeTargetPage + 1 < totalPages) priorityIndices.push(safeTargetPage + 1);
        if (safeTargetPage + 2 < totalPages) priorityIndices.push(safeTargetPage + 2);
        if (safeTargetPage - 1 >= 0) priorityIndices.push(safeTargetPage - 1);

        for (const idx of priorityIndices) {
          document.getElementById('loading-text').innerText = 'Подготовка страниц (' + (idx + 1) + ' / ' + totalPages + ')...';
          const url = await renderPdfPageToDataUrl(idx + 1);
          if (url) {
            memoryTextureCache.set(idx, url);
            renderedPageImages[idx] = url;
            if (activeBookId) {
              saveSinglePageToCache(activeBookId, idx, url);
            }
          }
        }

        buildBookFromImages(renderedPageImages, dim, safeTargetPage);
        updatePageIndicator(safeTargetPage);
        hideLoading();
        hideHud();

        // Queue background preloading for the remainder of the book
        updateSlidingWindow(safeTargetPage);
      } catch (err) {
        console.error('loadPdfDocument error:', err);
        alert('Ошибка при открытии PDF: ' + (err.message || err));
        hideLoading();
      }
    }

    // Native Bridge / SAF File Picker
    function triggerPickPdf() {
      hideHud();
      if (window.AndroidBridge && window.AndroidBridge.pickPdf) {
        window.AndroidBridge.pickPdf();
      } else {
        document.getElementById('hidden-file-input').click();
      }
    }

    function onLocalFilePicked(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const typedArray = new Uint8Array(evt.target.result);
        const bookId = 'local_' + Date.now();
        currentBookId = bookId;
        loadPdfDocument(typedArray, file.name, 0, bookId);
      };
      reader.readAsArrayBuffer(file);
    }

    // Android interface hooks
    window.onBookAdded = async function(bookId, fileName, bookUrl) {
      showLoading('Добавление в библиотеку...');
      try {
        const loadingTask = pdfjsLib.getDocument({ url: bookUrl });
        const pdf = await loadingTask.promise;
        const numPages = pdf.numPages;

        let thumbnail = '';
        try {
          const page1 = await pdf.getPage(1);
          const vp = page1.getViewport({ scale: 0.35 });
          const thumbCanvas = document.createElement('canvas');
          thumbCanvas.width = vp.width;
          thumbCanvas.height = vp.height;
          const tCtx = thumbCanvas.getContext('2d');
          tCtx.fillStyle = '#FFFFFF';
          tCtx.fillRect(0, 0, vp.width, vp.height);
          await page1.render({ canvasContext: tCtx, viewport: vp }).promise;
          thumbnail = thumbCanvas.toDataURL('image/jpeg', 0.85);
        } catch (e) {
          console.warn('Cover generation error:', e);
        }

        const list = getStoredLibrary();
        const existingIdx = list.findIndex(b => b.id === bookId);
        const entry = {
          id: bookId,
          title: fileName,
          url: bookUrl,
          totalPages: numPages,
          lastPage: 0,
          lastReadTime: Date.now(),
          coverThumbnail: thumbnail
        };
        if (existingIdx >= 0) {
          list[existingIdx] = entry;
        } else {
          list.push(entry);
        }
        saveStoredLibrary(list);

        currentBookId = bookId;
        localStorage.setItem(STORAGE_LAST_BOOK_ID, bookId);
        closeBookshelf();
        await loadPdfDocument(bookUrl, fileName, 0, bookId);
      } catch (err) {
        console.error('onBookAdded error:', err);
        hideLoading();
        alert('Ошибка при сохранении книги: ' + (err.message || err));
      }
    };

    window.loadPdfFromUrl = function(pdfUrl, fileName) {
      loadPdfDocument(pdfUrl, fileName, 0, currentBookId);
    };

    window.loadPdfFromBase64 = function(base64Str, fileName) {
      try {
        const binaryString = window.atob(base64Str);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        loadPdfDocument(bytes, fileName, 0, currentBookId);
      } catch (e) {
        alert('Ошибка декодирования файла: ' + e.message);
      }
    };

    function recalculateAndRebuild() {
      resetZoom();
      if (renderedPageImages.length > 0) {
        const dim = getBookDimensions();
        buildBookFromImages(renderedPageImages, dim, currentPageIndex);
      } else {
        renderDemoBook();
      }
    }

    function showLoading(text) {
      const el = document.getElementById('loading-overlay');
      document.getElementById('loading-text').innerText = text;
      el.style.display = 'flex';
      el.style.opacity = '1';
    }

    function hideLoading() {
      const el = document.getElementById('loading-overlay');
      el.style.opacity = '0';
      setTimeout(() => {
        el.style.display = 'none';
      }, 300);
    }

    // Initialize on window load
    window.addEventListener('load', () => {
      initWebAudio();
      initPinchZoom();
      const savedTheme = localStorage.getItem('paperbook_theme') || 'original';
      setTheme(savedTheme);
      setTimeout(() => {
        const list = getStoredLibrary();
        const lastBookId = localStorage.getItem(STORAGE_LAST_BOOK_ID);
        if (lastBookId && lastBookId !== 'demo' && list.some(b => b.id === lastBookId)) {
          openBookFromShelf(lastBookId);
        } else if (list.length > 0) {
          openBookshelf();
        } else {
          renderDemoBook();
        }

        if (window.AndroidBridge && window.AndroidBridge.onViewerReady) {
          window.AndroidBridge.onViewerReady();
        }
      }, 100);
    });

    window.addEventListener('resize', () => {
      clearTimeout(window._resizeTimer);
      window._resizeTimer = setTimeout(recalculateAndRebuild, 250);
    });

    // Tap outside HUD closes it
    document.addEventListener('click', (e) => {
      if (hudVisible && !e.target.closest('.hud-panel') && !e.target.closest('#touch-hud-trigger')) {
        hideHud();
      }
    });
  </script>
